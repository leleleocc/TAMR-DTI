<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #eef4fb; stroke: #c7d2df; stroke-width: 3; }
      .box { fill: #d9e8fb; stroke: #adc4e8; stroke-width: 2; }
      .box2 { fill: #e4effc; stroke: #b6cae6; stroke-width: 2; }
      .film { fill: #eaf7ef; stroke: #8cc7a3; stroke-width: 2; }
      .out { fill: #fff7df; stroke: #e0bd70; stroke-width: 2; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #174a9c; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #315070; font-weight: 600; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #6b7280; font-weight: 500; }
      .arrow { stroke: #275aa4; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .greenArrow { stroke: #16834a; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#275aa4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#16834a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1450" height="760"/>
  <text class="text" x="725" y="58" font-size="34" text-anchor="middle">
    Protein Encoder: Ligand-conditioned ProteinACmix x 3
  </text>

  <rect class="box2" x="70" y="220" width="250" height="92" rx="22"/>
  <text class="text" x="195" y="256" font-size="23" text-anchor="middle">Protein Seed Tokens</text>
  <text class="small" x="195" y="287" font-size="18" text-anchor="middle">P^0  [L_p x 128]</text>

  <rect class="film" x="500" y="92" width="260" height="82" rx="20"/>
  <text class="text" x="630" y="125" font-size="22" text-anchor="middle">Ligand Context</text>
  <text class="small" x="630" y="153" font-size="18" text-anchor="middle">d_g  [128]</text>

  <rect class="panel" x="380" y="210" width="840" height="330" rx="42"/>
  <text class="text" x="800" y="250" font-size="26" text-anchor="middle">Repeat for l = 1, 2, 3</text>

  <rect class="box" x="430" y="300" width="210" height="110" rx="20"/>
  <text class="text" x="535" y="334" font-size="21" text-anchor="middle">Half FFN</text>
  <text class="small" x="535" y="363" font-size="16" text-anchor="middle">0.5 FFN(P^{l-1})</text>
  <text class="small" x="535" y="388" font-size="16" text-anchor="middle">+ 0.5 P^{l-1}</text>

  <rect class="film" x="705" y="300" width="210" height="110" rx="20"/>
  <text class="text" x="810" y="331" font-size="21" text-anchor="middle">FiLM</text>
  <text class="small" x="810" y="360" font-size="16" text-anchor="middle">gamma^l, beta^l</text>
  <text class="small" x="810" y="386" font-size="16" text-anchor="middle">from d_g</text>

  <rect class="box" x="980" y="300" width="210" height="110" rx="20"/>
  <text class="text" x="1085" y="331" font-size="21" text-anchor="middle">ProteinACmix</text>
  <text class="small" x="1085" y="360" font-size="16" text-anchor="middle">Relative MHSA</text>
  <text class="small" x="1085" y="386" font-size="16" text-anchor="middle">+ Dynamic Conv + FFN</text>

  <rect class="out" x="1268" y="220" width="130" height="92" rx="22"/>
  <text class="text" x="1333" y="256" font-size="22" text-anchor="middle">Protein</text>
  <text class="text" x="1333" y="284" font-size="22" text-anchor="middle">Tokens P</text>

  <path class="arrow" d="M 320 266 L 380 266"/>
  <path class="arrow" d="M 400 355 L 430 355"/>
  <path class="arrow" d="M 640 355 L 705 355"/>
  <path class="arrow" d="M 915 355 L 980 355"/>
  <path class="arrow" d="M 1190 355 C 1240 355, 1238 266, 1268 266"/>

  <path class="greenArrow" d="M 630 174 C 630 225, 720 250, 810 300"/>
  <path class="greenArrow" d="M 760 133 C 920 155, 995 220, 1050 300"/>

  <text class="muted" x="820" y="462" font-size="20" text-anchor="middle">
    P^l = ProteinACmix( FiLM( 0.5 FFN(P^{l-1}) + 0.5 P^{l-1}, d_g ) )
  </text>
  <text class="muted" x="820" y="496" font-size="18" text-anchor="middle">
    FiLM means feature-wise scale and shift: U~ = U * (1 + gamma^l) + beta^l
  </text>

  <rect class="box2" x="455" y="590" width="540" height="62" rx="18"/>
  <text class="text" x="725" y="629" font-size="22" text-anchor="middle">
    Output goes to protein-side Mamba residual refinement
  </text>
</svg>
