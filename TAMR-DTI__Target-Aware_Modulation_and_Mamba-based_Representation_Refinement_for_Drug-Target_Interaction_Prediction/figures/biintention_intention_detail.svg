<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #eef4fb; stroke: #c7d2df; stroke-width: 3; }
      .branchDrug { fill: #e1edfb; stroke: #abc2e6; stroke-width: 2; }
      .branchProt { fill: #eaf1fb; stroke: #abc2e6; stroke-width: 2; }
      .box { fill: #d8e7fb; stroke: #adc4e8; stroke-width: 2; }
      .box2 { fill: #f0f6ff; stroke: #bdd0ea; stroke-width: 2; }
      .smallBox { fill: #ffffff; stroke: #c7d2df; stroke-width: 1.5; }
      .out { fill: #dbe7f5; stroke: #9fb5d2; stroke-width: 2; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #12489b; font-weight: 700; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #174a9c; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #2f4f72; font-weight: 600; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #6b7280; font-weight: 500; }
      .arrow { stroke: #275aa4; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .arrowThin { stroke: #275aa4; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .purple { stroke: #7c3aed; stroke-width: 3.5; fill: none; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#275aa4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="800" y="55" font-size="34" text-anchor="middle">
    BiIntention Detail: Self-Attention + Bidirectional Intention Blocks
  </text>

  <!-- Input tokens -->
  <rect class="box2" x="88" y="94" width="320" height="82" rx="20"/>
  <text class="text" x="248" y="128" font-size="23" text-anchor="middle">Fused Drug Tokens</text>
  <text class="small" x="248" y="158" font-size="18" text-anchor="middle">D  [354 x 128]</text>

  <rect class="box2" x="1192" y="94" width="320" height="82" rx="20"/>
  <text class="text" x="1352" y="128" font-size="23" text-anchor="middle">Refined Protein Tokens</text>
  <text class="small" x="1352" y="158" font-size="18" text-anchor="middle">P~  [Lp x 128]</text>

  <!-- Self attention -->
  <rect class="box" x="138" y="218" width="220" height="68" rx="18"/>
  <text class="text" x="248" y="247" font-size="20" text-anchor="middle">Drug Self-Attn</text>
  <text class="muted" x="248" y="271" font-size="15" text-anchor="middle">outputs D_s</text>

  <rect class="box" x="1242" y="218" width="220" height="68" rx="18"/>
  <text class="text" x="1352" y="247" font-size="20" text-anchor="middle">Protein Self-Attn</text>
  <text class="muted" x="1352" y="271" font-size="15" text-anchor="middle">outputs P_s</text>

  <path class="arrow" d="M 248 176 L 248 218"/>
  <path class="purple" d="M 1352 176 L 1352 218"/>

  <!-- Main panel -->
  <rect class="panel" x="70" y="330" width="1460" height="500" rx="60"/>
  <text class="muted" x="800" y="365" font-size="20" text-anchor="middle">
    one BiIntention layer uses two mirrored IntentionBlocks
  </text>

  <!-- Branch backgrounds -->
  <rect class="branchDrug" x="120" y="392" width="650" height="350" rx="28"/>
  <rect class="branchProt" x="830" y="392" width="650" height="350" rx="28"/>

  <text class="text" x="445" y="426" font-size="24" text-anchor="middle">Protein-guided Drug Intention</text>
  <text class="muted" x="445" y="452" font-size="16" text-anchor="middle">source = P_s, query = D_s</text>

  <text class="text" x="1155" y="426" font-size="24" text-anchor="middle">Drug-guided Protein Intention</text>
  <text class="muted" x="1155" y="452" font-size="16" text-anchor="middle">source = D_s, query = P_s</text>

  <!-- Left branch details -->
  <rect class="smallBox" x="154" y="480" width="170" height="62" rx="12"/>
  <text class="small" x="239" y="506" font-size="16" text-anchor="middle">source P_s</text>
  <text class="muted" x="239" y="528" font-size="14" text-anchor="middle">LayerNorm -> K,V</text>

  <rect class="smallBox" x="154" y="600" width="170" height="62" rx="12"/>
  <text class="small" x="239" y="626" font-size="16" text-anchor="middle">query D_s</text>
  <text class="muted" x="239" y="648" font-size="14" text-anchor="middle">linear -> Q</text>

  <rect class="box2" x="374" y="480" width="220" height="72" rx="14"/>
  <text class="text" x="484" y="508" font-size="18" text-anchor="middle">Intention map A</text>
  <text class="muted" x="484" y="532" font-size="14" text-anchor="middle">softmax(pinv(KT K + lambda I) KT V)</text>

  <rect class="box2" x="374" y="600" width="220" height="72" rx="14"/>
  <text class="text" x="484" y="628" font-size="18" text-anchor="middle">Query update</text>
  <text class="muted" x="484" y="652" font-size="14" text-anchor="middle">O = Q A</text>

  <rect class="box" x="630" y="532" width="110" height="92" rx="14"/>
  <text class="text" x="685" y="565" font-size="17" text-anchor="middle">Drug-side</text>
  <text class="text" x="685" y="588" font-size="17" text-anchor="middle">tensor</text>
  <text class="small" x="685" y="614" font-size="15" text-anchor="middle">V_d [d x d]</text>

  <path class="arrowThin" d="M 324 511 L 374 511"/>
  <path class="arrowThin" d="M 324 631 L 374 631"/>
  <path class="arrowThin" d="M 594 516 C 620 516, 620 557, 630 557"/>
  <path class="arrowThin" d="M 594 636 C 620 636, 620 600, 630 600"/>

  <!-- Right branch details -->
  <rect class="smallBox" x="864" y="480" width="170" height="62" rx="12"/>
  <text class="small" x="949" y="506" font-size="16" text-anchor="middle">source D_s</text>
  <text class="muted" x="949" y="528" font-size="14" text-anchor="middle">LayerNorm -> K,V</text>

  <rect class="smallBox" x="864" y="600" width="170" height="62" rx="12"/>
  <text class="small" x="949" y="626" font-size="16" text-anchor="middle">query P_s</text>
  <text class="muted" x="949" y="648" font-size="14" text-anchor="middle">linear -> Q</text>

  <rect class="box2" x="1084" y="480" width="220" height="72" rx="14"/>
  <text class="text" x="1194" y="508" font-size="18" text-anchor="middle">Intention map A</text>
  <text class="muted" x="1194" y="532" font-size="14" text-anchor="middle">softmax(pinv(KT K + lambda I) KT V)</text>

  <rect class="box2" x="1084" y="600" width="220" height="72" rx="14"/>
  <text class="text" x="1194" y="628" font-size="18" text-anchor="middle">Query update</text>
  <text class="muted" x="1194" y="652" font-size="14" text-anchor="middle">O = Q A</text>

  <rect class="box" x="1340" y="532" width="110" height="92" rx="14"/>
  <text class="text" x="1395" y="565" font-size="17" text-anchor="middle">Protein-side</text>
  <text class="text" x="1395" y="588" font-size="17" text-anchor="middle">tensor</text>
  <text class="small" x="1395" y="614" font-size="15" text-anchor="middle">V_p [d x d]</text>

  <path class="arrowThin" d="M 1034 511 L 1084 511"/>
  <path class="arrowThin" d="M 1034 631 L 1084 631"/>
  <path class="arrowThin" d="M 1304 516 C 1330 516, 1330 557, 1340 557"/>
  <path class="arrowThin" d="M 1304 636 C 1330 636, 1330 600, 1340 600"/>

  <!-- Routes from self attention to branches -->
  <path class="arrow" d="M 248 286 C 248 330, 239 390, 239 480"/>
  <path class="purple" d="M 1352 286 C 1352 330, 949 365, 949 480"/>
  <path class="arrowThin" d="M 248 286 C 248 345, 949 365, 949 600"/>
  <path class="arrowThin" d="M 1352 286 C 1352 345, 239 365, 239 600"/>

  <!-- Pooling and output -->
  <rect class="box2" x="270" y="775" width="260" height="66" rx="18"/>
  <text class="text" x="400" y="803" font-size="20" text-anchor="middle">Max-Pool</text>
  <text class="small" x="400" y="827" font-size="16" text-anchor="middle">h_d [128]</text>

  <rect class="box2" x="1070" y="775" width="260" height="66" rx="18"/>
  <text class="text" x="1200" y="803" font-size="20" text-anchor="middle">Max-Pool</text>
  <text class="small" x="1200" y="827" font-size="16" text-anchor="middle">h_p [128]</text>

  <path class="arrow" d="M 685 624 C 685 710, 400 710, 400 775"/>
  <path class="arrow" d="M 1395 624 C 1395 710, 1200 710, 1200 775"/>

  <rect class="out" x="590" y="875" width="420" height="70" rx="4"/>
  <text class="text" x="800" y="904" font-size="22" text-anchor="middle">Concatenate</text>
  <text class="small" x="800" y="932" font-size="17" text-anchor="middle">f = [h_d ; h_p]  [256] -> MLP score</text>

  <path class="arrow" d="M 400 841 C 400 895, 540 895, 590 910"/>
  <path class="arrow" d="M 1200 841 C 1200 895, 1060 895, 1010 910"/>
</svg>
