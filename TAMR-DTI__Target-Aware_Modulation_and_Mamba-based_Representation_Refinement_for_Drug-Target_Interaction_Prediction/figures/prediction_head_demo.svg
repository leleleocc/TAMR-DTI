<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="430" viewBox="0 0 1250 430">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #e4effc; stroke: #b6cae6; stroke-width: 2; }
      .mlp { fill: #d9e8fb; stroke: #9fb9de; stroke-width: 2; }
      .out { fill: #eaf7ef; stroke: #93c5a8; stroke-width: 2; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #174a9c; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #315070; font-weight: 600; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #6b7280; font-weight: 500; }
      .arrow { stroke: #275aa4; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#275aa4"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1250" height="430"/>

  <text class="text" x="625" y="50" font-size="32" text-anchor="middle">
    Prediction Head after BiIntention
  </text>

  <rect class="box" x="60" y="125" width="180" height="78" rx="18"/>
  <text class="text" x="150" y="157" font-size="22" text-anchor="middle">h_d</text>
  <text class="small" x="150" y="184" font-size="18" text-anchor="middle">[B, 128]</text>

  <rect class="box" x="60" y="245" width="180" height="78" rx="18"/>
  <text class="text" x="150" y="277" font-size="22" text-anchor="middle">h_p</text>
  <text class="small" x="150" y="304" font-size="18" text-anchor="middle">[B, 128]</text>

  <rect class="mlp" x="315" y="180" width="210" height="90" rx="18"/>
  <text class="text" x="420" y="214" font-size="23" text-anchor="middle">Concatenate</text>
  <text class="small" x="420" y="244" font-size="18" text-anchor="middle">f = [h_d ; h_p]</text>
  <text class="small" x="420" y="266" font-size="16" text-anchor="middle">[B, 256]</text>

  <rect class="mlp" x="610" y="105" width="250" height="240" rx="22"/>
  <text class="text" x="735" y="138" font-size="24" text-anchor="middle">MLP Decoder</text>
  <text class="small" x="735" y="178" font-size="17" text-anchor="middle">Linear 256 -> 256</text>
  <text class="muted" x="735" y="204" font-size="15" text-anchor="middle">ReLU + LayerNorm</text>
  <text class="small" x="735" y="238" font-size="17" text-anchor="middle">Linear 256 -> 256</text>
  <text class="muted" x="735" y="264" font-size="15" text-anchor="middle">ReLU + LayerNorm</text>
  <text class="small" x="735" y="298" font-size="17" text-anchor="middle">Linear 256 -> 128</text>
  <text class="muted" x="735" y="324" font-size="15" text-anchor="middle">ReLU + LayerNorm</text>

  <rect class="out" x="945" y="145" width="230" height="76" rx="18"/>
  <text class="text" x="1060" y="177" font-size="22" text-anchor="middle">Interaction Logit</text>
  <text class="small" x="1060" y="203" font-size="18" text-anchor="middle">s  [B, 1]</text>

  <rect class="out" x="945" y="270" width="230" height="76" rx="18"/>
  <text class="text" x="1060" y="302" font-size="22" text-anchor="middle">Probability</text>
  <text class="small" x="1060" y="328" font-size="18" text-anchor="middle">sigmoid(s)</text>

  <path class="arrow" d="M 240 164 C 270 164, 282 200, 315 216"/>
  <path class="arrow" d="M 240 284 C 270 284, 282 250, 315 234"/>
  <path class="arrow" d="M 525 225 L 610 225"/>
  <path class="arrow" d="M 860 225 C 900 225, 905 183, 945 183"/>
  <path class="arrow" d="M 1060 221 L 1060 270"/>

  <text class="muted" x="625" y="385" font-size="17" text-anchor="middle">
    Training uses the logit s with BCEWithLogitsLoss; sigmoid is applied for probabilities during evaluation.
  </text>
</svg>
