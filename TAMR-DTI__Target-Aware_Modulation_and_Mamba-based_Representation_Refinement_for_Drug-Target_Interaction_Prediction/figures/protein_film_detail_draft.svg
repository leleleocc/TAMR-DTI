<text x="144" y="626" class="h2" fill="#2c4a99" text-anchor="start">How it fuses (per layer, repeated 3×)</text>
<text x="144" y="658" class="bl" fill="#1f2733" text-anchor="start">1.  half-residual FF:</text><text x="344" y="658" class="mono2" fill="#1f2733" text-anchor="start">h = ½·FFᵢ(x) + ½·x</text>
<text x="144" y="688" class="bl" fill="#c0392b" text-anchor="start">2.  ligand FiLM:</text><text x="344" y="688" class="mono2" fill="#1f2733" text-anchor="start">h ← h · (1 + s·tanh(γᵢ)) + s·βᵢ      (γᵢ, βᵢ) = split( FiLM-MLPᵢ(d_g) ),   s = film_scale = 0.1</text>
<text x="144" y="718" class="bl" fill="#2c4a99" text-anchor="start">3.  ACmix block:</text><text x="344" y="718" class="mono2" fill="#1f2733" text-anchor="start">x ← ACmixᵢ(h, mask)      (dynamic conv + self-attention)</text>
<text x="144" y="754" class="cap" fill="#5a6675" text-anchor="start">• 3 independent FiLM-MLPs → 3 separate (γ,β) pairs, all from the SAME ligand context d_g.   • γ,β are per-channel, broadcast over all residues.</text>
<text x="144" y="778" class="cap" fill="#5a6675" text-anchor="start">• d_g = mean of fused drug tokens.   • p_g = masked-mean(P⁰), used only to score conformers (α_k) — not part of this stack.</text>
</svg>