# M1-g2-n8 on Human random: target-aware modulation + protein-Mamba + BiIntention.
# 目的: 外部数据集 main-result，保持 BindingDB M1-g2-n8 主模型参数不变。
# 运行时应配套:
#   --data datasets/human --split random --cache_root cache/features

DRUG:
  NODE_IN_FEATS: 75
  PADDING: true
  HIDDEN_LAYERS: [128, 128, 128]
  NODE_IN_EMBEDDING: 128
  MAX_NODES: 290
  NUM_CONFORMERS: 8
  CONFORMER_ATOMS: 64
  USE_TARGET_AWARE_CONF: true
  FUSION_GATE_BIAS: -2.0

PROTEIN:
  NUM_FILTERS: [128, 128, 128]
  KERNEL_SIZE: [3, 6, 9]
  EMBEDDING_DIM: 128
  NUM_HEAD: 8
  MAX_LEN: 128
  PADDING: true
  USE_LIGAND_FILM: true
  FILM_SCALE: 0.05

CROSSINTENTION:
  LAYER: 1
  NUM_HEAD: 8
  EMBEDDING_DIM: 128
  FUSION_MODE: protein_mamba_biintention
  USE_INTERACTION_FIELD: false
  FIELD_ENHANCE_GATE_BIAS: -2.0
  MAMBA_D_STATE: 16
  MAMBA_D_CONV: 4
  MAMBA_EXPAND: 2
  MAMBA_BIDIRECTIONAL: true
  MAMBA_DROPOUT: 0.1
  # sigmoid(-2.0) ~= 0.119, stronger than M1-g4's ~= 0.018.
  MAMBA_ENHANCE_GATE_BIAS: -2.0
  MAMBA_USE_FAST_PATH: false
  MAMBA_BACKEND: mamba1
  CF_START_EPOCH: 30
  CF_TOP_RATIO: 0.15
  CF_MARGIN: 0.1
  CF_KEY_WEIGHT: 0.0
  CF_STABLE_WEIGHT: 0.0
  FIELD_ENTROPY_WEIGHT: 0.0

DECODER:
  NAME: MLP
  IN_DIM: 256
  HIDDEN_DIM: 256
  OUT_DIM: 128
  BINARY: 1

SOLVER:
  MAX_EPOCH: 100
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  LR: 0.0001
  USE_LD: true
  LR_DECAY: 0.5
  DECAY_INTERVAL: 25
  LR_SCHEDULER: plateau
  LR_PATIENCE: 5
  MIN_LR: 0.000001
  WEIGHT_DECAY: 0.0001
  USE_POS_WEIGHT: true
  POS_WEIGHT: 0.0
  EARLY_STOP_PATIENCE: 10
  BEST_METRIC: acc
  MIN_DELTA: 0.0001
  SEED: 42

RESULT:
  OUTPUT_DIR: outputs/result/
  SAVE_MODEL: true
