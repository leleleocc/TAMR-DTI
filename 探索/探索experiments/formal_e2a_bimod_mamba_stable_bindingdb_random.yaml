# E2a: MambaFusion 训练策略排查版。
# 目的: 在不改 Mamba 架构的前提下，检查 E2 较差是否来自学习率、best checkpoint 指标或早停策略。
# 与 E2 的主要差异:
#   - LR: 1e-4 -> 5e-5，降低 Mamba 训练震荡风险
#   - BEST_METRIC: acc -> auroc，和论文主指标更一致
#   - LR_PATIENCE / EARLY_STOP_PATIENCE 拉长，避免 plateau 后低学习率阶段被截断

DRUG:
  NODE_IN_FEATS: 75
  PADDING: true
  HIDDEN_LAYERS: [128, 128, 128]
  NODE_IN_EMBEDDING: 128
  MAX_NODES: 290
  NUM_CONFORMERS: 8
  CONFORMER_ATOMS: 64
  USE_TARGET_AWARE_CONF: true
  FUSION_GATE_BIAS: -2.0

PROTEIN:
  NUM_FILTERS: [128, 128, 128]
  KERNEL_SIZE: [3, 6, 9]
  EMBEDDING_DIM: 128
  NUM_HEAD: 8
  MAX_LEN: 128
  PADDING: true
  USE_LIGAND_FILM: true
  FILM_SCALE: 0.05

CROSSINTENTION:
  LAYER: 1
  NUM_HEAD: 8
  EMBEDDING_DIM: 128
  FUSION_MODE: mamba
  USE_INTERACTION_FIELD: false
  FIELD_ENHANCE_GATE_BIAS: -2.0
  MAMBA_D_STATE: 16
  MAMBA_D_CONV: 4
  MAMBA_EXPAND: 2
  MAMBA_BIDIRECTIONAL: true
  MAMBA_DROPOUT: 0.1
  MAMBA_ENHANCE_GATE_BIAS: -2.0
  MAMBA_USE_FAST_PATH: false
  MAMBA_BACKEND: mamba1
  CF_START_EPOCH: 30
  CF_TOP_RATIO: 0.15
  CF_MARGIN: 0.1
  CF_KEY_WEIGHT: 0.02
  CF_STABLE_WEIGHT: 0.01
  FIELD_ENTROPY_WEIGHT: 0.0

DECODER:
  NAME: MLP
  IN_DIM: 256
  HIDDEN_DIM: 256
  OUT_DIM: 128
  BINARY: 1

SOLVER:
  MAX_EPOCH: 100
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  LR: 0.00005
  USE_LD: true
  LR_DECAY: 0.5
  DECAY_INTERVAL: 25
  LR_SCHEDULER: plateau
  LR_PATIENCE: 8
  MIN_LR: 0.000001
  WEIGHT_DECAY: 0.0001
  USE_POS_WEIGHT: true
  POS_WEIGHT: 0.0
  EARLY_STOP_PATIENCE: 20
  BEST_METRIC: auroc
  MIN_DELTA: 0.0001
  SEED: 42

RESULT:
  OUTPUT_DIR: outputs/result/
  SAVE_MODEL: true
